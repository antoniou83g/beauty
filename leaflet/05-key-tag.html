<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenday Key Tag</title>
<!-- Key tag · 46 × 96 mm trim + 3 mm bleed, arched top r23, hole Ø10 mm. Magenta dashed = die-cut. Suggest 600 µm laminated card or PVC. -->
<style>
  @font-face{font-family:'Manrope';font-weight:200 800;src:url(fonts/manrope-greek.woff2) format('woff2');unicode-range:U+0370-03FF}
  @font-face{font-family:'Manrope';font-weight:200 800;src:url(fonts/manrope-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:'Manrope';font-weight:200 800;src:url(fonts/manrope-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
  @font-face{font-family:'Noto Serif Display';font-weight:100 900;src:url(fonts/noto-serif-display-greek.woff2) format('woff2');unicode-range:U+0370-03FF}
  @font-face{font-family:'Noto Serif Display';font-weight:100 900;src:url(fonts/noto-serif-display-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122}
  @font-face{font-family:'Noto Serif Display';font-style:italic;font-weight:100 900;src:url(fonts/noto-serif-display-italic-greek.woff2) format('woff2');unicode-range:U+0370-03FF}
  @font-face{font-family:'Noto Serif Display';font-style:italic;font-weight:100 900;src:url(fonts/noto-serif-display-italic-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122}
  @font-face{font-family:'Zenday Wordmark';font-weight:400;font-display:block;src:url(fonts/zenday-wordmark.woff2) format('woff2')}

  :root{--oxblood:#491009;--brick:#972010;--cream:#F7ECE4;--sand:#F3EBE5;--blush:#FEDADB;--rose:#F3B7B3;--gold:#C6A664}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#2a2a2a}
  body{font-family:Manrope,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-rendering:geometricPrecision}
  .wm{font-family:'Zenday Wordmark',serif;font-weight:400;letter-spacing:0;white-space:nowrap}
  .k{font:800 5.6pt/1.3 Manrope,sans-serif;letter-spacing:.24em;text-transform:uppercase}
  em{font-style:italic;font-weight:300}
  .page{position:relative;overflow:hidden;margin:0 auto 10mm;break-after:page}
  .page:last-child{margin-bottom:0}
  .die{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  @media print{html,body{background:none}.page{margin:0}}

  @page{size:52mm 102mm;margin:0}
  .page{width:52mm;height:102mm}

  .a{background:var(--oxblood);color:var(--cream);text-align:center}
  .a .k{position:absolute;left:0;right:0;top:28mm;color:var(--gold);font-size:4.6pt}
  .a h3{position:absolute;left:7mm;right:7mm;top:35mm;font:400 16pt/1.02 'Noto Serif Display',serif}
  .a h3 em{color:var(--rose)}
  .a .wm{position:absolute;left:0;right:0;bottom:10mm;font-size:8pt}
  .b{background:var(--cream);color:var(--oxblood);text-align:center}
  .b img{position:absolute;left:11mm;top:29mm;width:30mm}
  .b h3{position:absolute;left:5mm;right:5mm;top:64mm;font:400 11pt/1.05 'Noto Serif Display',serif}
  .b h3 em{color:var(--brick)}
  .b h3 .wm{font-size:8.5pt;color:var(--brick)}
  .b .k{position:absolute;left:0;right:0;bottom:11mm;font-size:4.4pt;color:var(--brick)}

</style></head><body>
<section class="page a" aria-label="Μπροστά"><p class="k">Για freelancers</p><h3>Το κλειδί<br>για νέους<br><em>πελάτες.</em></h3><span class="wm">Zenday</span><svg class="die" viewBox="0 0 52 102" aria-hidden="true"><g fill="none" stroke="#e5007e" stroke-width=".3" stroke-dasharray="1.2 .9"><path d="M3 26 A23 23 0 0 1 49 26 V93 A6 6 0 0 1 43 99 H9 A6 6 0 0 1 3 93 Z"/><circle cx="26" cy="15" r="5"/></g></svg></section>
<section class="page b" aria-label="Πίσω"><img src="qr.svg" alt="QR εγγραφής"><h3>Every day<br><em>is</em> <span class="wm">Zenday</span>.</h3><p class="k">Σκανάρετε · δωρεάν εγγραφή</p><svg class="die" viewBox="0 0 52 102" aria-hidden="true"><g fill="none" stroke="#e5007e" stroke-width=".3" stroke-dasharray="1.2 .9"><path d="M3 26 A23 23 0 0 1 49 26 V93 A6 6 0 0 1 43 99 H9 A6 6 0 0 1 3 93 Z"/><circle cx="26" cy="15" r="5"/></g></svg></section>
</body></html>
